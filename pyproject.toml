[tool.poetry]
name = "a-maze-ing"
version = "1.0.0"
description = "A-Maze-ing maze generator and renderer"
authors = ["jcascale y mjabalqu <estudiantes@42malaga.com>"]
# Le indicamos a Poetry dónde está tu código
packages = [
    { include = "mazegen*" },
    { include = "a_maze_ing.py" },
    { include = "render.py" },
    { include = "get_maze_data.py" }
]

[tool.poetry.dependencies]
python = ">=3.10"
# Aquí es donde le decimos que lea el wheel local
mlx = {path = "mlx-2.2-py3-none-any.whl"}

[tool.poetry.scripts]
play_maze = "a_maze_ing:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"