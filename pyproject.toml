[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [{name="jcascale y mjabalqu"}]
description = "A-Maze-ing maze generator"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mazegen*"]